button{font:inherit; color:inherit; background:none; border:0; padding:0; margin:0; cursor:pointer}

h1,p,figure{margin:0; padding:0; font:inherit}
.frame{max-width:1200px; margin:0 auto; padding:0 var(--gr) 0 var(--gl)}
html{height:100%}
html[data-plane]{overflow:hidden}
html[data-plane] body{height:100%; overflow:hidden; overscroll-behavior:none}
/* over the plane the name and the links float above the pictures and stay legible on any of them */

  padding-top:calc(20px + env(safe-area-inset-top, 0px))}
html[data-plane] .top a{pointer-events:auto; color:inherit}

.top{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; padding-top:20px}
.top a{display:inline-flex; align-items:center; justify-content:center; min-height:44px; text-underline-offset:5px; text-decoration-thickness:1px}
.name{font-size:17px; letter-spacing:.07em}
.top nav, .top .nums{display:flex; align-items:center}
.top .num{position:relative; min-width:38px; color:var(--quiet); letter-spacing:.06em}
/* the project that is open: its numeral in ink with a point under it (a line under a link only reads as a link) */
.top nav .num[aria-current]{text-decoration-line:none}
.top .num[aria-current]::after{content:""; position:absolute; left:50%; bottom:4px; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:currentColor}
.top .info{margin-left:22px}
.top nav a:hover, .top nav a[aria-current]{text-decoration-line:underline}
.top a[aria-current]{color:var(--ink)}

main{padding-bottom:calc(var(--gap) + 40px); min-height:60vh}
main:focus{outline:none}
main.bleed{max-width:none; padding-left:0; padding-right:0}
.turned main{animation:arrive .18s linear}
@keyframes arrive{from{opacity:0}}
@media (prefers-reduced-motion:reduce){ .turned main{animation:none} }

.words{padding-top:clamp(28px, 4vw, 56px); max-width:31em}
.words p + p{margin-top:1.15em}
.words .q{margin-top:2.4em; color:var(--quiet)}
.words a{text-decoration:underline; text-underline-offset:4px; text-decoration-thickness:1px; display:inline-block; padding:10px 0; margin:-10px 0}

/* the contact form, on Information: three lines to write on and one word to send */
.contact{display:grid; max-width:31em}
.contact label{color:var(--quiet); margin-top:14px}
.contact input, .contact textarea{font:inherit; color:inherit; background:none; border:0; border-bottom:1px solid var(--quiet); border-radius:0;
  box-sizing:border-box; width:100%; min-height:44px; padding:8px 0; margin:0; -webkit-appearance:none; appearance:none}
.contact textarea{min-height:8em; resize:vertical; line-height:1.6}
.contact input:focus-visible, .contact textarea:focus-visible{outline:none; border-bottom-color:var(--ink); box-shadow:0 1px 0 var(--ink)}
.contact .hp{position:absolute; left:-9999px; width:1px; height:1px; opacity:0}
.contact button{justify-self:start; min-height:44px; margin-top:12px; text-decoration:underline; text-underline-offset:5px; text-decoration-thickness:1px}
.contact button[disabled]{color:var(--quiet); cursor:default}
.contact .status{min-height:1.6em; color:var(--quiet)}
@media (max-width:699px){ .contact input, .contact textarea{font-size:16px} }   /* a phone zooms in on smaller type */

/* the plane */
.plane{position:fixed; inset:0; overflow:hidden; touch-action:none; cursor:grab; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
.plane, .plane img{-webkit-tap-highlight-color:transparent}
.plane.held{cursor:grabbing}
.plane figure{position:absolute; left:0; top:0; will-change:transform}
.plane img{display:block; width:100%; height:100%; -webkit-user-drag:none; background:color-mix(in srgb, var(--ink) 6%, var(--paper)); color:transparent; font-size:0}
.hint{color:inherit; opacity:.7; transition:opacity .6s}
.hint.gone{opacity:0}
@media (prefers-reduced-motion:reduce){ .hint{transition:none} }

/* one picture, registered to the top-left corner of the frame */
.one{position:relative; margin-top:clamp(20px, 3vw, 44px); min-height:calc(100vh - 210px)}
.one img{display:block; max-width:100%; height:auto; background-size:100% 100%; background-repeat:no-repeat}
@supports (height:1svh){ .one{min-height:calc(100svh - 210px)} }
/* the two halves you press to go back and on: a press shows nothing (a phone would otherwise darken the whole half) */
.zone{position:absolute; top:0; bottom:0; width:50%; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; touch-action:pinch-zoom}
.zoomed .zone{touch-action:auto}   /* pinched in: a finger moves the page about again */
/* a swipe carries the picture with it: let go short and it comes back, far enough and it leaves */
.one img.back{transition:transform .18s ease-out, opacity .18s ease-out}
.one img.away{transition:transform .13s ease-in, opacity .13s ease-in}
@media (prefers-reduced-motion:reduce){ .one img.back, .one img.away{transition:none} }

.zone.prev{left:0; cursor:w-resize} .zone.next{right:0; cursor:e-resize}
.zone:focus-visible{outline-offset:-1px}

.x{pointer-events:auto; display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; margin-right:-14px}
.x svg{display:block; pointer-events:none}
/* the project's photographs in a row above the foot, opened by its name */

    <h1 class="sr">Information</h1>
    <p>I’m Kevin, a photographer based in San Francisco.</p>
    <p>My work explores communities on the fringes of society and in close proximity to nature. I take a documentary approach grounded in lasting relationships.</p>
    <p>I spent 2021 and 2022 traveling the western United States embedded in the rock climbing community carrying a 35mm camera. My ongoing work is focused on isolated island communities in the San Juan Islands in Washington State.</p>

      colour = want; try { localStorage.setItem("plane", colour ? "colour" : "mixed"); } catch (e) {}
      draw(true); return;
    }
    const th = t.closest(".th");
    if (th) { idx = +th.dataset.n; draw(false); }
  });
  function step(dx, dy) { // on the plane an arrow key moves it most of a window
    if (!moved) { moved = true; const h = document.getElementById("hint"); if (h) h.classList.add("gone"); }
    if (calm) { cam.x += dx * innerWidth * 0.6; cam.y += dy * innerHeight * 0.6; paint(); return; }
    glide.x += dx * innerWidth * 0.6; glide.y += dy * innerHeight * 0.6; kick();
  }
  // The contact form posts to a small Worker that emails Kevin (worker/contact.js); his address is never on the page.
  const CONTACT = "";
  let shownAt = 0;
  document.addEventListener("submit", async (e) => {
    const f = e.target; if (f.id !== "contact") return;
    e.preventDefault();
    const say = (t) => { f.querySelector(".status").textContent = t; }, send = f.querySelector("button");
    const v = Object.fromEntries(new FormData(f)), name = v.name.trim(), email = v.email.trim(), message = v.message.trim();
    if (!name || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || !message) { say("Please give your name, an email address and a message."); return; }
    if (!CONTACT) { say("This form is not connected yet."); return; }
    send.disabled = true; say("Sending");
    try {
      const r = await fetch(CONTACT, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, message, website: v.website, t: Math.round((performance.now() - shownAt) / 1000) }) });
      if (!r.ok) throw new Error(r.status);
      f.reset(); say("Sent. Thank you.");
    } catch (err) { say("That did not send. Please try again."); }
    send.disabled = false;
  });
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
    if (e.target.closest && e.target.closest("input, textarea, select")) return;   // typing in the form is just typing
    const k = e.key, t = e.target, wallOn = view === "home" && !open;
    if ((k === "Enter" || k === " ") && t.dataset && t.dataset.i !== undefined) { e.preventDefault(); openAt(+t.dataset.i); }
    else if (k === "ArrowRight" || k === "j") { e.preventDefault(); if (view !== "information") wallOn ? step(1, 0) : turn(1); }
    else if (k === "ArrowLeft" || k === "k") { e.preventDefault(); if (view !== "information") wallOn ? step(-1, 0) : turn(-1); }
    else if (wallOn && (k === "ArrowDown" || k === "ArrowUp")) { e.preventDefault(); step(0, k === "ArrowDown" ? 1 : -1); }
    else if (k >= "1" && k <= "9" && ORDER[+k - 1]) go("#" + ORDER[+k - 1]);
    else if (k === "Escape" && !wallOn && view !== "information") { if (strip && S[view]) toggleStrip(); else close(); }
  });
  // Inside a frame (as in this preview) the keys go to whichever page was last clicked. Take them as soon as the
  // page is drawn, and again whenever the pointer comes onto it, so the arrow keys work without a click first.
  const takeKeys = () => {
    if (document.activeElement && document.activeElement !== document.body && document.activeElement !== main) return;
    try { window.focus(); } catch (e) {}
    main.focus({ preventScroll: true });
  };
  addEventListener("load", takeKeys); addEventListener("pageshow", takeKeys);
  document.addEventListener("pointerenter", takeKeys, true); document.addEventListener("mouseover", takeKeys);
  let rs = 0; addEventListener("resize", () => { clearTimeout(rs); rs = setTimeout(() => { layPlane(); sizeOne(); syncStrip(true); }, 80); });

  draw(false); takeKeys();
})();
</script>
